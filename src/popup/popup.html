<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName">Glasslight</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="glass">
      <header>
        <h1>Glasslight</h1>
        <label class="switch" data-i18n-title="optEnabled">
          <input type="checkbox" data-key="enabled" />
          <span></span>
        </label>
      </header>

      <section>
        <label class="row">
          <span><span data-i18n="optIntensity"></span> <output data-for="intensity"></output></span>
          <input type="range" min="0" max="100" step="5" data-key="intensity" />
        </label>
        <label class="row">
          <span><span data-i18n="optBlur"></span> <output data-for="blur"></output></span>
          <input type="range" min="8" max="48" step="2" data-key="blur" />
        </label>
        <label class="row">
          <span><span data-i18n="optTransparency"></span> <output data-for="transparency"></output></span>
          <input type="range" min="0" max="100" step="5" data-key="transparency" />
        </label>
        <label class="row">
          <span><span data-i18n="optContrast"></span> <output data-for="contrastTarget"></output></span>
          <input type="range" min="1.5" max="4.5" step="0.5" data-key="contrastTarget" />
        </label>
      </section>

      <section>
        <div class="row">
          <span data-i18n="optBackdrop" id="backdrop-label"></span>
          <div class="segmented" role="radiogroup" aria-labelledby="backdrop-label">
            <label><input type="radio" name="backdrop" value="enlarged" data-key="backdrop" /><span data-i18n="optBackdropEnlarged"></span></label>
            <label><input type="radio" name="backdrop" value="hybrid" data-key="backdrop" /><span data-i18n="optBackdropHybrid"></span></label>
            <label><input type="radio" name="backdrop" value="radial" data-key="backdrop" /><span data-i18n="optBackdropRadial"></span></label>
          </div>
        </div>
      </section>

      <section>
        <label class="toggle"><span data-i18n="optRefraction"></span><input type="checkbox" data-key="refraction" /></label>
        <label class="toggle"><span data-i18n="optReduceTransparency"></span><input type="checkbox" data-key="reduceTransparency" /></label>
        <label class="toggle"><span data-i18n="optPerformance"></span><input type="checkbox" data-key="performance" /></label>
      </section>

      <section>
        <label class="toggle">
          <span data-i18n="optLanguage"></span>
          <!-- Language names are written in their own language on purpose. -->
          <select id="language">
            <option value="auto" data-i18n="optLanguageAuto"></option>
            <option value="zh_TW" lang="zh-Hant">繁體中文</option>
            <option value="zh_CN" lang="zh-Hans">简体中文</option>
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
            <option value="ja" lang="ja">日本語</option>
            <option value="ko" lang="ko">한국어</option>
          </select>
        </label>
      </section>

      <footer><button id="reset" type="button" data-i18n="optReset"></button></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
