<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle">Glasslight</title>
    <link rel="icon" href="../../icons/icon-32.png" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="top">
      <img src="../../icons/icon-128.png" alt="" width="40" height="40" />
      <h1 data-i18n="optionsTitle"></h1>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <main>
      <!-- Every setting: name and control on one row, what it does below. -->
      <section aria-labelledby="sec-general">
        <h2 id="sec-general" data-i18n="secGeneral"></h2>
        <div class="setting">
          <label class="name" for="s-enabled" data-i18n="optEnabled"></label>
          <div class="control">
            <label class="switch"><input id="s-enabled" type="checkbox" role="switch" data-key="enabled" aria-describedby="d-enabled" /><span></span></label>
          </div>
          <p class="desc" id="d-enabled" data-desc="enabled"></p>
        </div>
        <div class="setting">
          <label class="name" for="language" data-i18n="optLanguage"></label>
          <div class="control">
            <!-- Language names are written in their own language on purpose. -->
            <select id="language" aria-describedby="d-language">
              <option value="auto" data-i18n="optLanguageAuto"></option>
              <option value="zh_TW" lang="zh-Hant">繁體中文</option>
              <option value="zh_CN" lang="zh-Hans">简体中文</option>
              <option value="en" lang="en">English</option>
              <option value="es" lang="es">Español</option>
              <option value="ja" lang="ja">日本語</option>
              <option value="ko" lang="ko">한국어</option>
            </select>
          </div>
          <p class="desc" id="d-language" data-desc="language"></p>
        </div>
      </section>

      <div class="dims">
        <section aria-labelledby="sec-appearance">
          <h2 id="sec-appearance" data-i18n="secAppearance"></h2>
          <div class="setting">
            <label class="name" for="s-intensity"><span data-i18n="optIntensity"></span> <output data-for="intensity"></output></label>
            <div class="control"><input id="s-intensity" type="range" min="0" max="100" step="5" data-key="intensity" aria-describedby="d-intensity" /></div>
            <p class="desc" id="d-intensity" data-desc="intensity"></p>
          </div>
          <div class="setting">
            <label class="name" for="s-blur"><span data-i18n="optBlur"></span> <output data-for="blur"></output></label>
            <div class="control"><input id="s-blur" type="range" min="8" max="48" step="2" data-key="blur" aria-describedby="d-blur" /></div>
            <p class="desc" id="d-blur" data-desc="blur"></p>
          </div>
          <div class="setting">
            <label class="name" for="s-transparency"><span data-i18n="optTransparency"></span> <output data-for="transparency"></output></label>
            <div class="control"><input id="s-transparency" type="range" min="0" max="100" step="5" data-key="transparency" aria-describedby="d-transparency" /></div>
            <p class="desc" id="d-transparency" data-desc="transparency"></p>
          </div>
          <div class="setting">
            <label class="name" for="s-refraction" data-i18n="optRefraction"></label>
            <div class="control">
              <label class="switch"><input id="s-refraction" type="checkbox" role="switch" data-key="refraction" aria-describedby="d-refraction" /><span></span></label>
            </div>
            <p class="desc" id="d-refraction" data-desc="refraction"></p>
          </div>
          <div class="setting">
            <label class="name" for="s-reduceTransparency" data-i18n="optReduceTransparency"></label>
            <div class="control">
              <label class="switch"><input id="s-reduceTransparency" type="checkbox" role="switch" data-key="reduceTransparency" aria-describedby="d-reduceTransparency" /><span></span></label>
            </div>
            <p class="desc" id="d-reduceTransparency" data-desc="reduceTransparency"></p>
          </div>
        </section>

        <section aria-labelledby="sec-behavior">
          <h2 id="sec-behavior" data-i18n="secBehavior"></h2>
          <div class="setting">
            <span class="name" id="l-backdrop" data-i18n="optBackdrop"></span>
            <div class="control">
              <div class="segmented" role="radiogroup" aria-labelledby="l-backdrop" aria-describedby="d-backdrop">
                <label><input type="radio" name="backdrop" value="enlarged" data-key="backdrop" /><span data-i18n="optBackdropEnlarged"></span></label>
                <label><input type="radio" name="backdrop" value="hybrid" data-key="backdrop" /><span data-i18n="optBackdropHybrid"></span></label>
                <label><input type="radio" name="backdrop" value="radial" data-key="backdrop" /><span data-i18n="optBackdropRadial"></span></label>
              </div>
            </div>
            <p class="desc" id="d-backdrop" data-desc="backdrop"></p>
          </div>
          <div class="setting">
            <label class="name" for="s-performance" data-i18n="optPerformance"></label>
            <div class="control">
              <label class="switch"><input id="s-performance" type="checkbox" role="switch" data-key="performance" aria-describedby="d-performance" /><span></span></label>
            </div>
            <p class="desc" id="d-performance" data-desc="performance"></p>
          </div>
          <div class="setting">
            <label class="name" for="s-static" data-i18n="optStatic"></label>
            <div class="control">
              <label class="switch"><input id="s-static" type="checkbox" role="switch" data-key="static" aria-describedby="d-static" /><span></span></label>
            </div>
            <p class="desc" id="d-static" data-desc="static"></p>
          </div>
        </section>

        <section aria-labelledby="sec-advanced">
          <h2 id="sec-advanced" data-i18n="secAdvanced"></h2>
          <div class="setting">
            <label class="name" for="s-contrastTarget"><span data-i18n="optContrast"></span> <output data-for="contrastTarget"></output></label>
            <div class="control"><input id="s-contrastTarget" type="range" min="1.5" max="4.5" step="0.5" data-key="contrastTarget" aria-describedby="d-contrastTarget" /></div>
            <p class="desc" id="d-contrastTarget" data-desc="contrastTarget"></p>
          </div>
          <div class="setting">
            <span class="name" data-i18n="optReset"></span>
            <div class="control"><button id="reset" type="button" class="danger" data-i18n="resetAction" aria-describedby="d-reset"></button></div>
            <p class="desc" id="d-reset" data-desc="reset"></p>
          </div>
        </section>
      </div>

      <!-- Voluntary support. Unrelated to every setting above: nothing here
           is checked, stored or unlocked. -->
      <section aria-labelledby="sec-support" class="support">
        <h2 id="sec-support" data-i18n="secSupport"></h2>
        <p data-desc="donateIntro"></p>
        <ul>
          <li data-desc="donateVoluntary"></li>
          <li data-desc="donateSeller"></li>
          <li data-desc="donateUse"></li>
          <li data-desc="donateRefund"></li>
        </ul>
        <div class="donate-row">
          <button id="donate" type="button" class="donate" data-i18n="donateButton"></button>
          <span id="donate-test" class="test-badge" data-i18n="donateTestLink" hidden></span>
        </div>
      </section>
    </main>

    <script src="../shared/defaults.js"></script>
    <script src="../shared/prefs.js"></script>
    <script src="options.js"></script>
  </body>
</html>
